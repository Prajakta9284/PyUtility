
name: PyUtility Quality Checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest hypothesis mypy black isort coverage sphinx

      - name: Check formatting
        run: |
          python -m black --check pyutility tests examples
          python -m isort --check-only pyutility tests examples

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report -m

      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/build/html
